# Render Blueprint for Boomerang (BUILD_PLAN step 1.11).
# Field names checked against https://render.com/docs/blueprint-spec on 2026-11-09.
#
# Secrets use `sync: false`: Render asks for them once when the Blueprint is first created,
# and they never live in this repository.

databases:
  - name: boomerang-db
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "17"
    databaseName: boomerang
    user: boomerang

services:
  # Webhook receiver, dashboard API and health check. Always-on paid plan so no webhook is missed.
  - type: web
    name: boomerang-api
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci --include=dev
    preDeployCommand: npm run db:migrate
    startCommand: npm run start -w @boomerang/api
    healthCheckPath: /healthz
    # Switch to checksPass once GitHub Actions runs on this account.
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: boomerang-db
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: POLICY_MODE
        # Set in the Render dashboard (dry_run or live); the code defaults to dry_run if unset.
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_SANDBOX_MERCHANT_EMAIL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional client-side cap per model; Groq's rate-limit headers pace calls either way.
      - key: GROQ_RPM
        value: "25"
      # The dashboard's address (6.1), comma-separated if more than one. Set in the Render dashboard.
      - key: DASHBOARD_ORIGINS
        sync: false
      # Shared secret the operator types into the dashboard; every /api route requires it.
      - key: OPERATOR_TOKEN
        sync: false
      - key: PAY_LINK_SECRET
        sync: false
      - key: SIM_WEBHOOK_SECRET
        sync: false

  # Overdue poller and follow-up scheduler: a long-running worker, because cron is too coarse for timers.
  - type: worker
    name: boomerang-worker
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci --include=dev
    startCommand: npm run start -w @boomerang/worker
    # Switch to checksPass once GitHub Actions runs on this account.
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: boomerang-db
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: POLICY_MODE
        # Set in the Render dashboard (dry_run or live); the code defaults to dry_run if unset.
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional client-side cap per model; Groq's rate-limit headers pace calls either way.
      - key: GROQ_RPM
        value: "25"

  # Operator dashboard (React + Vite, step 6.1). Talks to the API over HTTPS with the operator token.
  - type: web
    name: boomerang-dashboard
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w @boomerang/dashboard
    staticPublishPath: ./apps/dashboard/dist
    # Switch to checksPass once GitHub Actions runs on this account.
    autoDeployTrigger: commit
    # Client-side routes (/cases, /approvals, ...) all serve the app shell.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Public: baked into the bundle at build time.
      - key: VITE_API_URL
        value: https://boomerang-api-rgd8.onrender.com
      # AG Grid Enterprise licence key (6.5). Ends up in the browser bundle, but is kept out of the repo.
      - key: VITE_AG_GRID_LICENSE_KEY
        sync: false
