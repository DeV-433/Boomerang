services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: boomerang
      POSTGRES_PASSWORD: boomerang
      POSTGRES_DB: boomerang
    ports:
      - "5432:5432"
    volumes:
      - boomerang-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boomerang"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  boomerang-db:
